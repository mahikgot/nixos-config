theme = "gruvbox"

[editor]
line-number = "relative"
bufferline = "always"
clipboard-provider = "win32-yank"
default-yank-register = "+"

[keys.normal]
"C-c" = ["keep_primary_selection", "collapse_selection"]

[keys.insert]
"C-c" = "normal_mode"

[keys.select]
"C-c" = ["normal_mode", "keep_primary_selection", "collapse_selection"]
